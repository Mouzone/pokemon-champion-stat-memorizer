name: Update Pokemon Stats

on:
  schedule:
    - cron: '0 0 1 * *' # Run monthly on the 1st
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Run fetch script
        run: node scripts/fetch-stats.js
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/pokemon-data.json
          git commit -m "chore: Update Pokemon stats from Smogon" || echo "No changes to commit"
          git push
